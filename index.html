<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cookie Factory - リズムで稼ぐクッキー工場ゲーム</title>
<meta name="description" content="レーンを流れるクッキーをリズムよくタップして稼ぐ、ちょっと違うクッキークリッカー。工場で自動化、リボーンでツリー強化。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍪</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="toast-container"></div>
  <div id="changelog-modal" class="modal hidden"></div>
  <div id="confirm-modal" class="modal hidden"></div>
  <div id="offline-modal" class="modal hidden"></div>
  <div id="reborn-modal" class="modal hidden"></div>

  <header class="topbar">
    <h1>🍪 Cookie Factory</h1>
    <div class="stats">
      <div class="stat"><span class="stat-label">ドウ</span><span id="stat-dough">0</span></div>
      <div class="stat"><span class="stat-label">生産/秒</span><span id="stat-cps">0/秒</span></div>
      <div class="stat"><span class="stat-label">コンボ</span><span id="stat-combo">×1.0</span></div>
      <div class="stat" id="stat-grp-wrap"><span class="stat-label">🌟GRP</span><span id="stat-grp">0</span></div>
    </div>
    <button id="changelog-btn" class="icon-btn" title="更新履歴">📜</button>
  </header>

  <main class="layout">
    <section class="game-area">
      <div id="bpm-banner" class="bpm-banner hidden"></div>
      <div id="lanes-container" class="lanes-container"></div>
      <div class="rhythm-legend">
        <span class="leg-perfect">PERFECT</span>
        <span class="leg-good">GOOD</span>
        <span class="leg-ok">OK</span>
        <span class="leg-miss">MISS</span>
      </div>
      <div class="fake-hint">⚠️ 焦げた色の紛らわしい「ニセクッキー」はタップせず見送ろう(触ると失敗)</div>
    </section>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="buildings">🏭 工場</button>
      <button class="tab-btn" data-tab="upgrades">⬆️ 強化</button>
      <button class="tab-btn" data-tab="achievements">🏆 実績</button>
      <button class="tab-btn" data-tab="reborn">🔁 リボーン</button>
      <button class="tab-btn" data-tab="settings">⚙️ 設定</button>
    </nav>

    <section class="panel-content" id="panel-content"></section>
  </main>
</div>

<script src="js/format.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/save.js"></script>
<script src="js/rhythm.js"></script>
<script src="js/ui.js"></script>
<script src="js/version.js"></script>
<script src="js/main.js"></script>
</body>
</html>
